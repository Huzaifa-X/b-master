services:
  # Uncomment if you want to run a local PostgreSQL database
  # db:
  #   image: postgres:15-alpine
  #   restart: always
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-postgres}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
  #     POSTGRES_DB: ${POSTGRES_DB:-b_master}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Database (uses external DB from .env)
      DATABASE_URL: ${DATABASE_URL}

      # NextAuth
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # Upstage (Document parsing)
      UPSTAGE_API_KEY: ${UPSTAGE_API_KEY}
      ASKB_VECTOR_STORE_ID: ${ASKB_VECTOR_STORE_ID}

      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

      # AWS S3
      S3_AWS_ACCESS_KEY_ID: ${S3_AWS_ACCESS_KEY_ID}
      S3_AWS_SECRET_ACCESS_KEY: ${S3_AWS_SECRET_ACCESS_KEY}
      S3_AWS_S3_REGION_NAME: ${S3_AWS_S3_REGION_NAME}
      S3_AWS_STORAGE_BUCKET_NAME: ${S3_AWS_STORAGE_BUCKET_NAME}

      # Pusher (Real-time)
      PUSHER_APP_ID: ${PUSHER_APP_ID}
      PUSHER_KEY: ${PUSHER_KEY}
      PUSHER_SECRET: ${PUSHER_SECRET}
      PUSHER_CLUSTER: ${PUSHER_CLUSTER}
      NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY}
      NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # Dropbox Integration
      DROPBOX_CLIENT_ID: ${DROPBOX_CLIENT_ID}
      DROPBOX_CLIENT_SECRET: ${DROPBOX_CLIENT_SECRET}

      # Encryption
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # SMTP (Email)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-false}

      # Cron
      CRON_SECRET: ${CRON_SECRET}

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm run worker
    restart: always
    environment:
      # Database (uses external DB from .env)
      DATABASE_URL: ${DATABASE_URL}

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # Upstage
      UPSTAGE_API_KEY: ${UPSTAGE_API_KEY}

      # AWS S3
      S3_AWS_ACCESS_KEY_ID: ${S3_AWS_ACCESS_KEY_ID}
      S3_AWS_SECRET_ACCESS_KEY: ${S3_AWS_SECRET_ACCESS_KEY}
      S3_AWS_S3_REGION_NAME: ${S3_AWS_S3_REGION_NAME}
      S3_AWS_STORAGE_BUCKET_NAME: ${S3_AWS_STORAGE_BUCKET_NAME}

      # Pusher (for real-time updates from worker)
      PUSHER_APP_ID: ${PUSHER_APP_ID}
      PUSHER_KEY: ${PUSHER_KEY}
      PUSHER_SECRET: ${PUSHER_SECRET}
      PUSHER_CLUSTER: ${PUSHER_CLUSTER}

      # Encryption
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # SMTP (if worker sends emails)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-false}

# Uncomment if using local db service
# volumes:
#   postgres_data:
