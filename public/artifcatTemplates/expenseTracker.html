<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Business Expense Tracker</title>
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #eef2f7;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-size: 26px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #e0e6ed;
        }

        label {
            font-weight: 600;
            color: #444;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #d0d7e1;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #4c8bf5;
            box-shadow: 0 0 5px rgba(76, 139, 245, 0.3);
            outline: none;
        }

        button {
            background: #4c8bf5;
            color: white;
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
        }

        button:hover {
            background: #3b73d9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background: #f1f4f8;
            padding: 12px;
            font-weight: 700;
            color: #555;
            border-bottom: 1px solid #e0e6ed;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            color: #444;
        }

        tr:hover td {
            background: #f9fbff;
        }

        .delete-btn {
            background: #ff5a5a;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: #e14b4b;
        }

        .total-box {
            margin-top: 20px;
            font-weight: 700;
            padding: 14px;
            background: #e8f5e9;
            border: 1px solid #b7dfc0;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            color: #2e7d32;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Simple Business Expense Tracker</h2>

        <label>Date:</label>
        <input type="date" id="date" />

        <label>Description:</label>
        <input type="text" id="desc" placeholder="Enter expense description" />

        <label>Amount (PKR):</label>
        <input type="number" id="amount" placeholder="0" />

        <button onclick="addExpense()">Add Expense</button>

        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody id="expenseList"></tbody>
        </table>

        <div class="total-box">
            Total Expense: PKR <span id="total">0</span>
        </div>
    </div>

    <script>
        let expenses = [];

        function updateTable() {
            const list = document.getElementById("expenseList");
            list.innerHTML = "";

            let total = 0;

            expenses.forEach((exp, index) => {
                total += parseFloat(exp.amount);
                list.innerHTML += `
        <tr>
          <td>${exp.date}</td>
          <td>${exp.desc}</td>
          <td>${exp.amount}</td>
          <td><button onclick="deleteExpense(${index})">X</button></td>
        </tr>
      `;
            });

            document.getElementById("total").textContent = total;
        }

        function addExpense() {
            const date = document.getElementById("date").value;
            const desc = document.getElementById("desc").value;
            const amount = document.getElementById("amount").value;

            if (!date || !desc || !amount) {
                alert("Please fill all fields");
                return;
            }

            expenses.push({ date, desc, amount });
            updateTable();

            document.getElementById("date").value = "";
            document.getElementById("desc").value = "";
            document.getElementById("amount").value = "";
        }

        function deleteExpense(i) {
            expenses.splice(i, 1);
            updateTable();
        }
    </script>

</body>

</html>
